server.port=${PORT:8080}
# Lets the frontend show readable error messages (e.g. "Only your college email ... can be used")
server.error.include-message=always

# Only emails from this domain may register / log in
app.allowed-domain=anurag.edu.in
# CHANGE in production (min 32 chars) via the JWT_SECRET environment variable
app.jwt-secret=${JWT_SECRET:change-me-please-change-me-please-123456}
# Comma-separated list of frontend origins allowed to call the API
app.cors-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.github.io}

# Default: in-memory H2 (demo). For production set DB_URL / DB_USER / DB_PASSWORD (PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:mem:uniconnect;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
